name: tests

# Lance les tests à chaque push et à chaque pull request (cahier 7.4).
# data/raw/ n'est pas versionné : les tests qui lisent les fichiers Insee sont
# automatiquement ignorés ici (« skipped ») ; ils tournent en local.
on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests
        run: pytest -v
